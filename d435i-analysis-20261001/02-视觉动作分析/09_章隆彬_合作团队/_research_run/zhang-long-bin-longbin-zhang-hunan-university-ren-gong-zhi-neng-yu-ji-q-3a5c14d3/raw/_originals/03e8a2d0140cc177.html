 d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-px-4 tw-border-t-2 tw-border-gray-100"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><div class="tw-py-2"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Version 1</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-700">posted 12 May, 2026</p></div></div></div><div class="tw-pt-1"><div class="tw-pb-1"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-flex tw-justify-center tw-w-full tw-mb-2">You are reading this latest preprint version</span></p></div></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display: block;"><div><p>Marker-based motion capture systems provide highly accurate biomechanical measurements, but they are expensive, require reflective marker placement, and are typically limited to controlled laboratory environments. Their reliance on extensive post-processing also restricts real-time clinical applicability. Markerless pose estimation systems offer a more accessible alternative; however, their ability to reliably quantify clinically relevant dynamic gait stability metrics, such as anterior–posterior (AP) and mediolateral (ML) margin of stability (MoS), remains insufficiently validated. This study evaluated a cost-effective, multi-camera, three-dimensional, markerless motion-capture system based on MediaPipe to estimate gait stability. Ten participants walked on a treadmill at a constant speed of 1.1 m/s while data were collected simultaneously using a three-camera synchronized RGB setup and a gold-standard Vicon capture system. Because MoS relies heavily on accurate estimates of center of mass (CoM) motion and joint kinematics, the temporal trajectories of 14 anatomical landmarks were first compared across systems. The markerless system achieved a mean 3D Euclidean RMSE of 2.48 ± 0.69 cm, with median and 95th-percentile errors of 1.98 ± 0.51 cm and 4.09 ± 1.40 cm, respectively. Using a segmental CoM model, AP MoS values were − 19.6 ± 0.46 cm (marker-based) and − 18.6 ± 0.30 cm (markerless), while ML MoS values were 4.2 ± 0.1 cm and 3.9 ± 0.12 cm, respectively. Errors were larger in the AP direction (RMSE = 3.8 cm) than in the ML direction (RMSE = 0.83 cm). Similar trends were observed using pelvic CoM approximation. Paired <em>t</em>-tests showed no statistically significant differences between the two systems (<em>p &gt;</em> 0.05). These findings suggest that the proposed multi-camera markerless system can reliably estimate whole-body kinematics and gait stability metrics, support scalable clinical assessment of walking stability and fall risk beyond specialized laboratory environments.</p></div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><a href="/browse?subjectArea=Health%20sciences%2FAnatomy" class="tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition">Health sciences/Anatomy</span></a></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><a href="/browse?subjectArea=Health%20sciences%2FBiomarkers" class="tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition">Health sciences/Biomarkers</span></a></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><a href="/browse?subjectArea=Physical%20sciences%2FEngineering" class="tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition">Physical sciences/Engineering</span></a></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><a href="/browse?subjectArea=Health%20sciences%2FHealth%20care" class="tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition">Health sciences/Health care</span></a></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><a href="/browse?subjectArea=Health%20sciences%2FMedical%20research" class="tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition">Health sciences/Medical research</span></a></p></div></div></div></div><div cl ts reported.","formattedTitle":"Validated Multi-Camera Markerless Motion Capture with Real-Time Data Analytics for Gait Stability Assessment","fulltext":[],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":false,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":false,"hideJournal":true,"highlight":"","institution":"","isAcceptedByJournal":false,"isAuthorSuppliedPdf":true,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":false,"isPdf":true,"isPdfUpToDate":true,"isWithdrawnOrRetracted":false,"journal":{"display":true,"email":"info@researchsquare.com","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true},"keywords":"","lastPublishedDoi":"10.21203/rs.3.rs-9347103/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-9347103/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"\u003cp\u003eMarker-based motion capture systems provide highly accurate biomechanical measurements, but they are expensive, require reflective marker placement, and are typically limited to controlled laboratory environments. Their reliance on extensive post-processing also restricts real-time clinical applicability. Markerless pose estimation systems offer a more accessible alternative; however, their ability to reliably quantify clinically relevant dynamic gait stability metrics, such as anterior\u0026ndash;posterior (AP) and mediolateral (ML) margin of stability (MoS), remains insufficiently validated. This study evaluated a cost-effective, multi-camera, three-dimensional, markerless motion-capture system based on MediaPipe to estimate gait stability. Ten participants walked on a treadmill at a constant speed of 1.1 m/s while data were collected simultaneously using a three-camera synchronized RGB setup and a gold-standard Vicon capture system. Because MoS relies heavily on accurate estimates of center of mass (CoM) motion and joint kinematics, the temporal trajectories of 14 anatomical landmarks were first compared across systems. The markerless system achieved a mean 3D Euclidean RMSE of 2.48\u0026thinsp;\u0026plusmn;\u0026thinsp;0.69 cm, with median and 95th-percentile errors of 1.98\u0026thinsp;\u0026plusmn;\u0026thinsp;0.51 cm and 4.09\u0026thinsp;\u0026plusmn;\u0026thinsp;1.40 cm, respectively. Using a segmental CoM model, AP MoS values were \u0026minus;\u0026thinsp;19.6\u0026thinsp;\u0026plusmn;\u0026thinsp;0.46 cm (marker-based) and \u0026minus;\u0026thinsp;18.6\u0026thinsp;\u0026plusmn;\u0026thinsp;0.30 cm (markerless), while ML MoS values were 4.2\u0026thinsp;\u0026plusmn;\u0026thinsp;0.1 cm and 3.9\u0026thinsp;\u0026plusmn;\u0026thinsp;0.12 cm, respectively. Errors were larger in the AP direction (RMSE\u0026thinsp;=\u0026thinsp;3.8 cm) than in the ML direction (RMSE\u0026thinsp;=\u0026thinsp;0.83 cm). Similar trends were observed using pelvic CoM approximation. Paired \u003cem\u003et\u003c/em\u003e-tests showed no statistically significant differences between the two systems (\u003cem\u003ep\u0026thinsp;\u0026gt;\u003c/em\u003e\u0026thinsp;0.05). These findings suggest that the proposed multi-camera markerless system can reliably estimate whole-body kinematics and gait stability metrics, support scalable clinical assessment of walking stability and fall risk beyond specialized laboratory environments.\u003c/p\u003e","manuscriptTitle":"Validated Multi-Camera Markerless Motion Capture with Real-Time Data Analytics for Gait Stability Assessment","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2026-05-12 17:22:20","doi":"10.21203/rs.3.rs-9347103/v1","editorialEvents":[{
