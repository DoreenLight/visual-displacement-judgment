<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视觉位移测量实验汇报图</title>
  <style>
    :root { --blue:#2563eb; --red:#dc2626; --ink:#1f2937; --muted:#64748b; --grid:#dbe3ee; --soft:#f8fafc; }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; background:#eef2f7; color:var(--ink); font-family:-apple-system,"PingFang SC",sans-serif; }
    .report { width:1200px; margin:24px auto; background:#fff; padding:26px 34px 36px; }
    .masthead { border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:20px; }
    .eyebrow { color:var(--blue); font-size:15px; letter-spacing:2px; font-weight:700; }
    h1 { margin:7px 0 4px; font-size:30px; letter-spacing:.5px; }
    .subtitle { margin:0; color:var(--muted); font-size:15px; }
    figure { margin:0 0 25px; border:1px solid #d8e0ea; border-radius:8px; overflow:hidden; page-break-inside:avoid; background:#fff; }
    svg { display:block; width:100%; height:auto; background:#fff; }
    figcaption { border-top:1px solid #e5eaf0; padding:11px 17px 13px; color:#475569; font-size:14px; line-height:1.55; }
    .cap-label { color:var(--blue); font-weight:700; margin-right:8px; }
    .axis { fill:#475569; font-size:14px; }
    .tick { fill:#64748b; font-size:13px; }
    .title { fill:#111827; font-size:22px; font-weight:700; }
    .small { fill:#64748b; font-size:13px; }
    .value { fill:#1f2937; font-size:14px; font-weight:700; }
    .legend { fill:#475569; font-size:14px; }
    @page { size:A4 portrait; margin:10mm; }
    @media print {
      html, body { background:#fff; }
      .report { margin:0; width:1200px; padding:0; }
      figure { break-inside:avoid; }
    }
  </style>
</head>
<body>
<main class="report">
  <header class="masthead">
    <div class="eyebrow">VISUAL DISPLACEMENT MEASUREMENT · EXPERIMENT SUMMARY</div>
    <h1>视觉位移测量系统：标定、能力与条件改善</h1>
    <p class="subtitle">基于 4 点盲测与相邻点差分，汇总尺度标定、2 mm 判据能力及实验条件改善效果</p>
  </header>

  <figure>
    <svg viewBox="0 0 1200 505" role="img" aria-label="尺度标定：4 点盲测散点与拟合直线">
      <defs><clipPath id="clip1"><rect x="120" y="82" width="990" height="320"/></clipPath></defs>
      <text x="60" y="42" class="title">图1　尺度标定：4 点盲测</text>
      <text x="1110" y="42" text-anchor="end" class="small">n = 4</text>
      <rect x="120" y="82" width="990" height="320" fill="#fbfdff" stroke="#cbd5e1"/>
      <g stroke="#dbe3ee" stroke-width="1">
        <path d="M120 402H1110 M120 348.7H1110 M120 295.3H1110 M120 242H1110 M120 188.7H1110 M120 135.3H1110 M120 82H1110"/>
        <path d="M120 82V402 M285 82V402 M450 82V402 M615 82V402 M780 82V402 M945 82V402 M1110 82V402"/>
      </g>
      <g class="tick" text-anchor="middle"><text x="120" y="423">195</text><text x="285" y="423">200</text><text x="450" y="423">205</text><text x="615" y="423">210</text><text x="780" y="423">215</text><text x="945" y="423">220</text><text x="1110" y="423">225</text></g>
      <g class="tick" text-anchor="end"><text x="110" y="407">210</text><text x="110" y="353">215</text><text x="110" y="300">220</text><text x="110" y="247">225</text><text x="110" y="193">230</text><text x="110" y="140">235</text><text x="110" y="87">240</text></g>
      <g class="axis"><text x="615" y="461" text-anchor="middle">物理距离 (mm)</text><text transform="translate(32 242) rotate(-90)" text-anchor="middle">深度读数 (mm)</text></g>
      <g clip-path="url(#clip1)"><path d="M120 407.8 L1110 90.0" stroke="#dc2626" stroke-width="3" fill="none" stroke-dasharray="9 6"/></g>
      <g fill="#2563eb" stroke="#fff" stroke-width="3">
        <circle cx="285" cy="354.0" r="7"/><circle cx="978" cy="130.0" r="7"/><circle cx="615" cy="249.0" r="7"/><circle cx="549" cy="270.0" r="7"/>
      </g>
      <g class="small"><text x="300" y="347">(200.0, 214.4965)</text><text x="790" y="119">(221.0, 235.4898)</text><text x="626" y="267">(210.0, 224.3427)</text><text x="420" y="289">(208.0, 222.3742)</text></g>
      <g transform="translate(790 62)"><line x1="0" y1="0" x2="28" y2="0" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 4"/><text x="38" y="5" class="legend">拟合：z = 1.000446 × phys + 14.3323</text></g>
      <g transform="translate(830 365)"><rect width="245" height="62" rx="6" fill="#eff6ff" stroke="#bfdbfe"/><text x="16" y="26" class="value">R² = 0.99992</text><text x="16" y="48" class="value">RMSE = 0.0682 mm</text></g>
    </svg>
    <figcaption><span class="cap-label">说明</span>4 个盲测点沿拟合直线高度集中，尺度关系近似线性；RMSE 为 0.0682 mm，拟合决定系数 R² = 0.99992。</figcaption>
  </figure>

  <figure>
    <svg viewBox="0 0 1200 475" role="img" aria-label="系统能力与 2mm 判据的对数轴对比">
      <text x="60" y="42" class="title">图2　系统能力 vs 2mm 判据</text>
      <text x="1110" y="42" text-anchor="end" class="small">横轴为对数刻度</text>
      <rect x="300" y="83" width="790" height="276" fill="#fbfdff" stroke="#cbd5e1"/>
      <g stroke="#dbe3ee"><path d="M300 83V359 M458 83V359 M616 83V359 M774 83V359 M932 83V359 M1090 83V359"/></g>
      <g class="tick" text-anchor="middle"><text x="300" y="381">0.0001</text><text x="458" y="381">0.001</text><text x="616" y="381">0.01</text><text x="774" y="381">0.1</text><text x="932" y="381">1</text><text x="1090" y="381">10</text></g>
      <text x="695" y="417" class="axis" text-anchor="middle">实测值 (mm)，对数轴</text>
      <g class="axis" text-anchor="end"><text x="285" y="130">分辨力 MDR</text><text x="285" y="196">可复现性</text><text x="285" y="262">线性度 RMSE</text><text x="285" y="328">尺度误差@2mm</text></g>
      <g stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"><path d="M932 83V359"/></g>
      <text x="942" y="101" fill="#dc2626" font-size="13">2 mm 要求</text>
      <g fill="#2563eb"><rect x="300" y="113" width="443" height="26" rx="4"/><rect x="300" y="179" width="379" height="26" rx="4"/><rect x="300" y="245" width="451" height="26" rx="4"/><rect x="300" y="311" width="151" height="26" rx="4"/></g>
      <g fill="#fff" font-size="13" font-weight="700"><text x="732" y="131" text-anchor="end">0.061 mm</text><text x="668" y="197" text-anchor="end">0.024 mm</text><text x="740" y="263" text-anchor="end">0.068 mm</text><text x="442" y="329" text-anchor="end">0.0009 mm</text></g>
      <g class="value"><text x="758" y="131">33× 余量</text><text x="694" y="197">83× 余量</text><text x="766" y="263">29× 余量</text><text x="465" y="329">2222× 余量</text></g>
      <g transform="translate(300 441)"><rect width="15" height="15" rx="2" fill="#2563eb"/><text x="24" y="13" class="legend">实测值</text><line x1="100" y1="8" x2="127" y2="8" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 4"/><text x="137" y="13" class="legend">2 mm 要求</text></g>
    </svg>
    <figcaption><span class="cap-label">说明</span>所有实测能力均显著低于 2 mm 判据；横轴采用对数尺度，以同时呈现 0.0009–0.068 mm 的小量级差异及相对余量。</figcaption>
  </figure>

  <figure>
    <svg viewBox="0 0 1200 500" role="img" aria-label="相邻点差分真实变化与读数变化对比">
      <text x="60" y="42" class="title">图3　相邻点差分：读数变化 vs 真实变化</text>
      <text x="1110" y="42" text-anchor="end" class="small">正负方向均保留</text>
      <rect x="145" y="86" width="950" height="288" fill="#fbfdff" stroke="#cbd5e1"/>
      <g stroke="#dbe3ee"><path d="M145 230H1095 M145 158H1095 M145 302H1095"/></g>
      <g class="tick" text-anchor="end"><text x="135" y="91">+25</text><text x="135" y="163">+12.5</text><text x="135" y="235">0</text><text x="135" y="307">−12.5</text><text x="135" y="379">−25</text></g>
      <text x="62" y="230" class="axis" text-anchor="middle" transform="rotate(-90 62 230)">变化量 (mm)</text>
      <line x1="145" y1="230" x2="1095" y2="230" stroke="#475569" stroke-width="2"/>
      <g fill="#2563eb"><rect x="238" y="109" width="66" height="121" rx="3"/><rect x="334" y="109.1" width="66" height="120.9" rx="3"/><rect x="548" y="230" width="66" height="63.4" rx="3"/><rect x="644" y="230" width="66" height="64.4" rx="3"/><rect x="858" y="230" width="66" height="13" rx="3"/><rect x="954" y="230" width="66" height="12.7" rx="3"/></g>
      <g class="value" text-anchor="middle"><text x="271" y="101">+21.00</text><text x="367" y="101">+20.9933</text><text x="581" y="312">−11.00</text><text x="677" y="313">−11.1471</text><text x="891" y="262">−2.00</text><text x="987" y="262">−1.9685</text></g>
      <g class="axis" text-anchor="middle"><text x="319" y="410">200 → 221</text><text x="629" y="410">221 → 210</text><text x="939" y="410">210 → 208</text></g>
      <g class="value" text-anchor="middle"><rect x="238" y="428" width="162" height="34" rx="17" fill="#eff6ff"/><text x="319" y="451" fill="#2563eb">比例 0.9997</text><rect x="548" y="428" width="162" height="34" rx="17" fill="#eff6ff"/><text x="629" y="451" fill="#2563eb">比例 1.0134</text><rect x="858" y="428" width="162" height="34" rx="17" fill="#eff6ff"/><text x="939" y="451" fill="#2563eb">比例 0.9843</text></g>
      <g transform="translate(455 467)"><rect width="15" height="15" rx="2" fill="#2563eb"/><text x="24" y="13" class="legend">真实变化 / 读数变化（同色并排）</text></g>
    </svg>
    <figcaption><span class="cap-label">说明</span>相邻点差分的读数变化与真实变化保持同方向且接近等幅；最大比例偏差出现在 221 → 210 mm 对比，比例为 1.0134。</figcaption>
  </figure>

  <figure>
    <svg viewBox="0 0 1200 470" role="img" aria-label="三个实验条件改善效果前后对比">
      <text x="60" y="42" class="title">图4　三个实验条件的改善效果</text>
      <text x="1110" y="42" text-anchor="end" class="small">关键突破：从异常现象到可测状态</text>
      <g transform="translate(55 76)">
        <rect width="1090" height="100" rx="8" fill="#fff7f7" stroke="#fecaca"/>
        <rect x="0" y="0" width="8" height="100" rx="4" fill="#dc2626"/>
        <text x="30" y="31" class="value">黑背景</text><text x="30" y="57" class="small">消除红外污染</text>
        <g transform="translate(215 23)"><rect width="285" height="54" rx="6" fill="#fee2e2"/><text x="142" y="34" text-anchor="middle" fill="#991b1b" font-size="18" font-weight="700">改善前：MDR 199 mm</text></g>
        <path d="M540 50H650 M630 36L650 50L630 64" fill="none" stroke="#2563eb" stroke-width="4"/>
        <g transform="translate(685 23)"><rect width="365" height="54" rx="6" fill="#dbeafe"/><text x="182" y="34" text-anchor="middle" fill="#1d4ed8" font-size="18" font-weight="700">改善后：MDR 0.3 mm</text></g>
      </g>
      <g transform="translate(55 190)">
        <rect width="1090" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <rect x="0" y="0" width="8" height="100" rx="4" fill="#64748b"/>
        <text x="30" y="31" class="value">白纸展平</text><text x="30" y="57" class="small">消除深度空洞</text>
        <g transform="translate(215 23)"><rect width="285" height="54" rx="6" fill="#e2e8f0"/><text x="142" y="34" text-anchor="middle" fill="#475569" font-size="18" font-weight="700">改善前：有效像素 11%</text></g>
        <path d="M540 50H650 M630 36L650 50L630 64" fill="none" stroke="#2563eb" stroke-width="4"/>
        <g transform="translate(685 23)"><rect width="365" height="54" rx="6" fill="#dbeafe"/><text x="182" y="34" text-anchor="middle" fill="#1d4ed8" font-size="18" font-weight="700">改善后：有效像素 95%</text></g>
      </g>
      <g transform="translate(55 304)">
        <rect width="1090" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <rect x="0" y="0" width="8" height="100" rx="4" fill="#64748b"/>
        <text x="30" y="31" class="value">S4 算法</text><text x="30" y="57" class="small">中值锚定</text>
        <g transform="translate(215 23)"><rect width="285" height="54" rx="6" fill="#e2e8f0"/><text x="142" y="34" text-anchor="middle" fill="#475569" font-size="18" font-weight="700">改善前：MDR 虚高</text></g>
        <path d="M540 50H650 M630 36L650 50L630 64" fill="none" stroke="#2563eb" stroke-width="4"/>
        <g transform="translate(685 23)"><rect width="365" height="54" rx="6" fill="#dbeafe"/><text x="182" y="34" text-anchor="middle" fill="#1d4ed8" font-size="18" font-weight="700">改善后：MDR 真实</text></g>
      </g>
      <text x="600" y="442" text-anchor="middle" class="small">三项改善共同将测量从污染、空洞与统计偏差中解耦</text>
    </svg>
    <figcaption><span class="cap-label">说明</span>黑背景、白纸展平与 S4 中值锚定分别处理红外污染、深度空洞和 MDR 虚高问题，使系统进入可解释、可验证的测量状态。</figcaption>
  </figure>
</main>
</body>
</html>
