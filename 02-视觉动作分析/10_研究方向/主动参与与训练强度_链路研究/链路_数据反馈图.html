<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>康复链路设计图源</title><style>body{margin:0;background:#f3f6fa}.diagram-container{width:1440px;background:#fff}svg{display:block;font-family:"PingFang SC","Microsoft YaHei",sans-serif}text{fill:#20324a}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52657c}.head{font-size:22px;font-weight:650}.body{font-size:19px}.status{font-size:17px;fill:#94623b}.edge{fill:none;stroke:#426a97;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#327d6b;stroke-width:3;marker-end:url(#green)}.guard{fill:none;stroke:#b45548;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#red)}.box{fill:#f0f5fc;stroke:#aac1dc;stroke-width:2;rx:14}.slow{fill:#eef8f3;stroke:#9ecab5;stroke-width:2;rx:14}</style></head><body><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1510" viewBox="0 0 1440 1510" role="img" aria-label="康复链路设计中的数据与反馈以及独立安全门禁"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#426a97"/></marker><marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#327d6b"/></marker><marker id="red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#b45548"/></marker></defs>
<text class="title" x="60" y="50">状态理解 → 辅助与挑战 → 实际观察与效果反馈</text><text class="sub" x="60" y="84">DESIGN / 未实现：箭头是接口要求，不是运行验收；快慢时钟、阈值均需真实合同</text>
<rect class="box" x="60" y="120" width="840" height="115"/><text class="head" x="84" y="157">S0 患者 / 任务 / 能力 / 临床与设备边界</text><text class="body" x="84" y="192">TaskContext + RiskEnvelope · 限值和授权不能从健康论文复制</text><text class="status" x="84" y="220">未确认：临床/独立参照、设备安全模式与时钟</text>
<rect class="box" x="60" y="290" width="365" height="140"/><text class="head" x="84" y="327">S1 观察与实际执行记录</text><text class="body" x="84" y="362">RGB/深度/人体IMU；EMG/力</text><text class="body" x="84" y="393">症状/心理量表、辅助状态与时间</text><text class="status" x="84" y="420">GAP：哪些流真实存在与同步</text>
<rect class="box" x="515" y="290" width="385" height="140"/><text class="head" x="539" y="327">S2 同步 / 单位 / 有效性</text><text class="body" x="539" y="362">逐通道 validity + 校准版本</text><text class="body" x="539" y="393">缺失、过期、重建身份显式保留</text><text class="status" x="539" y="420">GAP：不靠平滑伪装有效观测</text>
<path class="edge" d="M480 235 L480 265 L242 265 L242 290"/><path class="edge" d="M425 360 L515 360"/>
<rect class="box" x="60" y="505" width="365" height="140"/><text class="head" x="84" y="542">S3 运动状态与质量</text><text class="body" x="84" y="577">角度、轨迹、任务阶段、代偿</text><text class="body" x="84" y="608">几何有效 ≠ 主动贡献有效</text><text class="status" x="84" y="635">GAP：独立运动学/质量参照</text>
<rect class="box" x="515" y="505" width="385" height="140"/><text class="head" x="539" y="542">S4 双参与 + S5 约束</text><text class="body" x="539" y="577">物理贡献 / 心理评价 / unknown</text><text class="body" x="539" y="608">两类分别记录；疲劳/疼痛/能力</text><text class="status" x="539" y="635">GAP：物理参照 / 心理评价参照</text>
<path class="edge" d="M705 430 L705 468 L242 468 L242 505"/><path class="edge" d="M705 468 L705 505"/>
<rect class="box" x="60" y="720" width="840" height="155"/><text class="head" x="84" y="758">S6 监督决策：多目标权衡 + 不确定性门禁</text><text class="body" x="84" y="794">质量 / 物理 / 心理 / 挑战 / 剂量分别评价；先满足获准约束</text><text class="body" x="84" y="828">缺努力、失效或未校准 → 不做努力驱动加负荷；低EMG不诊断slacking</text><text class="status" x="84" y="860">DESIGN：只发 DecisionRequest，不直接输出设备力矩</text><path class="edge" d="M242 645 L242 720"/><path class="edge" d="M705 645 L705 720"/>
<rect class="box" x="60" y="945" width="365" height="125"/><text class="head" x="84" y="983">辅助 / 任务调整候选</text><text class="body" x="84" y="1018">包络内的参数引用、理由、期限</text><text class="status" x="84" y="1050">DESIGN：请求 ≠ 已执行</text>
<rect class="box" x="515" y="945" width="385" height="125"/><text class="head" x="539" y="983">S7 已批准控制器</text><text class="body" x="539" y="1018">接受/拒绝 + 实际应用回执</text><text class="status" x="539" y="1050">MISSING：控制实现与物理验证</text><path class="edge" d="M242 875 L242 945"/><path class="edge" d="M425 1008 L515 1008"/>
<rect class="box" x="60" y="1135" width="840" height="115"/><text class="head" x="84" y="1173">S8 患者—辅助交互 / 新观察 / 实际策略与异常</text><text class="body" x="84" y="1210">实际应用而非推荐进入暴露统计；新观测回到S1，真实结果进入S9</text><text class="status" x="84" y="1240">GAP：实际辅助/身心效果记录；本任务未执行</text><path class="edge" d="M705 1070 L705 1135"/>
<path class="feedback" d="M60 1193 L27 1193 L27 360 L60 360"/>
<rect x="985" y="120" width="390" height="1130" rx="16" fill="#fff3ef" stroke="#d3a59a" stroke-width="2"/><text class="head" x="1013" y="163">独立安全 / 临床停止路径</text><text class="body" x="1013" y="214">患者退出、疼痛、设备异常</text><text class="body" x="1013" y="248">始终高于估计与参与优化</text><text class="body" x="1013" y="301">可否决全部策略请求</text><text class="body" x="1013" y="335">不依赖ML多数投票</text><text class="body" x="1013" y="415">失效时的设备模式：</text><text class="body" x="1013" y="449">由已验证设备合同定义</text><text class="body" x="1013" y="483">不是默认加力或硬锁关节</text><text class="status" x="1013" y="570">MISSING：真实安全合同</text><text class="status" x="1013" y="605">没有授权 → 禁止设备执行</text><text class="sub" x="1013" y="657">症状/退出直达，不等ML判断</text><path class="guard" d="M900 575 L985 575"/><text class="sub" x="1013" y="725">理论稳定性 / 离线回放</text><text class="sub" x="1013" y="759">不替代物理安全或患者疗效</text><path class="guard" d="M985 805 L900 805"/><path class="guard" d="M985 1008 L900 1008"/>
<rect class="slow" x="60" y="1320" width="1315" height="140"/><text class="head" x="84" y="1358">S9 训练块效果 → S10 慢尺度复核 → S0 下一任务与上下文版本</text><text class="body" x="84" y="1396">分别记录心理参与、物理贡献及可观测覆盖、质量有效练习、挑战/剂量、症状与临床结果</text><text class="status" x="84" y="1430">GAP：不能把更多次数当目标达成；计划需临床批准，不能静默改处方/安全限值</text><path class="feedback" d="M480 1250 L480 1320"/><path class="feedback" d="M1375 1390 L1410 1390 L1410 1285 L930 1285 L930 180 L900 180"/>
</svg></div></body></html>
